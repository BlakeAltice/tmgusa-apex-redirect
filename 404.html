<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Redirecting to www.tmgusa.com</title>
<script>
  // Bare-domain redirector: forward the full path and query to the www site.
  location.replace('https://www.tmgusa.com' + location.pathname + location.search + location.hash);
</script>
<meta http-equiv="refresh" content="0; url=https://www.tmgusa.com/">
</head>
<body><p>Redirecting to <a href="https://www.tmgusa.com/">www.tmgusa.com</a></p></body>
</html>
